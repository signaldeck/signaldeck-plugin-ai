name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify chat Markdown rendering and load-order recovery
        run: node --test tests/chat_markdown.test.cjs
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "git+https://github.com/signaldeck/signaldeck-sdk.git@main"
      - run: python -m pip install --no-deps "git+https://github.com/signaldeck/signaldeck-plugin-main.git@feature/dummy-history-series"
      - run: python -m pip install "flask-socketio>=5.5,<6" "simple-websocket>=1.1,<2"
      - run: python -m pip install "git+https://github.com/signaldeck/signaldeck-plugin-sqlite.git@main"
      - run: python -m pip install --no-deps "git+https://github.com/signaldeck/signaldeck-plugin-socketio.git@main"
      - run: python -m pip install "mcp>=1.30,<2" "uvicorn>=0.35,<1" "httpx>=0.27,<1" "flask>=3.0" "jsonschema>=4.26,<5" pytest build
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q
      - name: Verify installed distribution name
        run: |
          python - <<'PY'
          from importlib.metadata import distribution
          dist = distribution("signaldeck-plugin-ai")
          assert dist.metadata["Name"] == "signaldeck-plugin-ai"
          import signaldeck_ai
          assert signaldeck_ai.__file__
          PY

      - run: python -m build --wheel --outdir dist
      - name: Confirm demo files stay outside plugin wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("dist").glob("signaldeck_plugin_ai-*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as zf:
              files = set(zf.namelist())
              assert not any(p.startswith(("config/", "tests/", "db/")) for p in files), files
              assert not any("ai.json" in p or "group_ai.json" in p for p in files), files
              assert any(p.endswith("templates/ai/chat.html") for p in files)
              assert any(p.endswith("static/js/chat.js") for p in files)
          PY
