services:
  signaldeck:
    image: signaldeck-ai
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      SIGNALDECK_MODE: prod
      SIGNALDECK_CONFIG: /config/ai.json
      SIGNALDECK_LOGGING_CONFIG: /app/logging_config.json
      SIGNALDECK_COLLECT_DATA: "false"
      SIGNALDECK_DEBUG: "false"
      SIGNALDECK_DEBUG_AUTO_RELOAD: "false"
    volumes:
      - ./config:/config
      - ./db:/app/db
      - ./logs:/app/logs
      - ./logging_config.json:/app/logging_config.json:ro
    # Host networking is intentional: cli-agent-api binds to 127.0.0.1.
    # Do not add ports: with network_mode: host they have no effect.
